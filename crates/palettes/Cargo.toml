[package]
name = "palettes"
description = "A modular Wayland desktop shell and widget library on aegle, drawn with Vulkan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[features]
default = ["svg"]
# SVG icons and images; most icon themes ship nothing else.
svg = ["dep:aegle-image", "aegle-image/svg"]
# am3's Material 3 controls as `Md*` elements in panel documents.
am3 = ["dep:am3"]

[dependencies]
palettes-shell.workspace = true
palettes-clock.workspace = true
palettes-workspace.workspace = true
palettes-audio.workspace = true
palettes-assets.workspace = true
aegle-ui.workspace = true
aegle-widgets.workspace = true
aegle-loader.workspace = true
aegle-image = { workspace = true, optional = true }
mlua = { version = "0.12", features = ["luau", "serialize"] }
serde_json = "1"
rustix = { version = "1", features = ["process", "std"] }
am3 = { git = "https://github.com/antinomie1/am3", branch = "master", optional = true }

[dev-dependencies]
# The popup test points and clicks from a second client.
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true

[lints]
workspace = true
